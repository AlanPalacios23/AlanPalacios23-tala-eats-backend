name: RC95 Delivery LIVE release gate (NO-GO)
on:
  push:
    branches: [feat/rc95-live-delivery-readiness-20261028]
    paths:
      - 'node-backend/scripts/rc95-live-delivery-readiness-audit.mjs'
      - 'node-backend/scripts/rc95-kali-prepare-driver-presence.sh'
      - 'node-backend/scripts/rc95-driver-presence-live-cutover.sh'
      - 'node-backend/src/config.ts'
      - 'node-backend/src/marketplace/driver.ts'
      - 'node-backend/src/marketplace/delivery-runtime.ts'
      - 'node-backend/tests/rc95-driver-presence.test.mjs'
      - 'node-backend/tests/rc95-live-delivery-audit.test.mjs'
      - '.github/workflows/rc95-delivery-live-nogo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source syntax
        working-directory: node-backend
        run: node --check scripts/rc95-live-delivery-readiness-audit.mjs
      - name: TypeScript compile (no LIVE environment)
        working-directory: node-backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate
          npm run build
      - name: Driver presence preparer is syntax-safe and does not support deploy
        working-directory: node-backend
        run: |
          bash -n scripts/rc95-kali-prepare-driver-presence.sh
          set +e
          bash scripts/rc95-kali-prepare-driver-presence.sh --apply 0c8d92fa62ae910843b3d4c764da85a852b17085 > prepare.log 2>&1
          code=$?
          set -e
          if [[ "$code" != 2 ]]; then cat prepare.log; exit 1; fi
          grep -q 'RC95_PREPARE_ABORT=USAGE' prepare.log
          echo 'RC95_NO_DEPLOY_WITH_PREPARER=PASS'
      - name: Presence-only cutover syntax, approval and recovery safeguards
        working-directory: node-backend
        run: |
          bash -n scripts/rc95-driver-presence-live-cutover.sh
          set +e
          bash scripts/rc95-driver-presence-live-cutover.sh --apply WRONG_APPROVAL > cutover.log 2>&1
          code=$?
          set -e
          test "$code" -eq 2
          grep -q 'RC95_CUTOVER_ABORT=USAGE_OR_APPROVAL' cutover.log
          grep -q 'RC95_AUTOMATIC_ROLLBACK=START' scripts/rc95-driver-presence-live-cutover.sh
          grep -q 'RC95_MANUAL_ROLLBACK_TO_RC94=PASS' scripts/rc95-driver-presence-live-cutover.sh
          grep -q 'RC95_LIVE_DELIVERY_CHECKOUT=LOCKED' scripts/rc95-driver-presence-live-cutover.sh
          grep -q 'RC95_LIVE_DELIVERY_CARD=LOCKED' scripts/rc95-driver-presence-live-cutover.sh
          echo 'RC95_CUTOVER_APPROVAL_AND_SAFE_RECOVERY=PASS'
      - name: Driver presence isolation tests
        working-directory: node-backend
        run: node --test tests/rc95-driver-presence.test.mjs
      - name: Fail-closed source audit regression
        working-directory: node-backend
        run: node --test tests/rc95-live-delivery-audit.test.mjs
      - name: NO-GO state is deliberate
        working-directory: node-backend
        run: |
          set +e
          node scripts/rc95-live-delivery-readiness-audit.mjs --source > audit.log
          status=$?
          set -e
          if [[ $status -ne 2 ]]; then cat audit.log; exit 1; fi
          grep -q '^RC95_DELIVERY_SOURCE_READINESS=NO_GO$' audit.log
          echo 'RC95_NOT_PREMATURELY_ENABLED=PASS'
