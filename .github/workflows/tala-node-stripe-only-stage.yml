name: TALA EATS | Stripe Only Kali Staging Candidate PG15 Redis8
on:
  push:
    branches: [feat/node-stripe-only-kali-stage-release-20261019, feat/node-kali-direct-pm2-release-20261020]
  pull_request:
    branches: [feat/node-last52-stage-contracts-j1-20261019, feat/node-stripe-only-kali-stage-release-20261019]
permissions:
  contents: read
jobs:
  stage-cash-pickup:
    name: Stripe-only Node stage; 249/252 plus three intentionally retired MP endpoints; full E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tala_node_stage
          POSTGRES_PASSWORD: stage-ci-pass
          POSTGRES_DB: tala_node_stage
        ports: ['15435:5432']
        options: >-
          --health-cmd "pg_isready -U tala_node_stage -d tala_node_stage"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:8
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: node-backend
    env:
      NODE_ENV: staging
      HOST: 127.0.0.1
      PORT: '18190'
      DATABASE_URL: postgresql://tala_node_stage:stage-ci-pass@127.0.0.1:15435/tala_node_stage
      REDIS_URL: redis://:stage-ci-redis@127.0.0.1:16379/0
      STRIPE_FINANCIAL_WRITES_ENABLED: 'false'
      AUTH_V02_ENABLED: 'true'
      MARKETPLACE_B_ENABLED: 'true'
      STAGE_PICKUP_CASH_CHECKOUT_ENABLED: 'true'
      AUTH_JWT_SECRET: ci-only-auth-secret-not-shared-with-prod-xxxxxxxxxxxxxxxxxxxxxxxxxx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - name: Strict Python route inventory unchanged
        run: |
          python3 scripts/python_route_inventory.py --check
          python3 scripts/node_route_coverage.py --check
          python3 scripts/node_route_coverage.py --json > /tmp/tala-node-first100.json
          python3 -c 'import json; p=json.load(open("/tmp/tala-node-first100.json")); assert p["structural_matches"]==249, p["structural_matches"]; assert p["python_routes_without_node_declaration"]==3, p["python_routes_without_node_declaration"]; expected={("POST","/api/v1/payments/mercadopago/orders/{order_id}/checkout"),("POST","/api/v1/payments/mercadopago/webhook"),("POST","/api/v1/payments/mercadopago/orders/{order_id}/refund")}; actual={(x["method"],x["path"]) for x in p["not_declared"]}; assert actual==expected, actual'
      - name: No-destructive SQL static migration gate and negative tests
        run: |
          python3 scripts/kali-stage-migration-static-audit.py --check
          python3 scripts/test_kali_stage_migration_static_audit.py
      - name: Frozen dependencies and disposable PG15 migrations
        run: |
          npm ci --no-audit --no-fund
          npm run generate
          npm run db:validate
          npm run db:migrate:deploy
      - name: Compilation and unit tests
        run: |
          npm run build
          npm test
      - name: Guard no Mercado Pago secrets and validate Stripe-only config
        run: |
          if MERCADOPAGO_ACCESS_TOKEN=stage-must-reject node -e "import('./dist/config.js')" > /tmp/tala-mp-env-guard.log 2>&1; then
            echo "ERROR: Mercado Pago credentials wrongly accepted"; exit 1
          fi
          grep -q STAGING_STRIPE_ONLY_FORBIDS_MERCADOPAGO_ENV /tmp/tala-mp-env-guard.log
          node -e "import('./dist/config.js')" && echo "STRIPE_ONLY_STAGE_CONFIG=PASS"
      - name: Secure CI-only Redis
        run: |
          node --input-type=module -e '
            import { Redis } from "ioredis";
            const r=new Redis("redis://127.0.0.1:16379");
            await r.config("SET","requirepass","stage-ci-redis");
            r.disconnect();
            const secured=new Redis(process.env.REDIS_URL);
            if(await secured.ping()!=="PONG")process.exitCode=1;
            secured.disconnect();
          '
      - name: Python auth, Phase B and atomic Phase C checkout REST E2E
        run: |
          set -euo pipefail
          node dist/server.js >/tmp/tala-node-cash-stage-e2e.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/ci-auth-contract-e2e.mjs
          node scripts/ci-marketplace-contract-e2e.mjs
          node scripts/ci-cash-pickup-atomic-e2e.mjs
          node scripts/ci-order-lifecycle-c2-e2e.mjs
          node scripts/ci-pickup-complete-c3-e2e.mjs
          node scripts/ci-python-node-decimal-parity-e2e.mjs
          node scripts/ci-owner-operational-d1-e2e.mjs
      - name: Synthetic driver lifecycle integration (separate feature-flagged process)
        env:
          STAGE_DRIVER_DELIVERY_ENABLED: 'true'
        run: |
          set -euo pipefail
          node dist/server.js > /tmp/tala-node-driver-d2.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/ci-driver-operational-d2-e2e.mjs
          node scripts/ci-customer-platform-e1-e2e.mjs
          node scripts/ci-platform-reviews-e2-e2e.mjs
          node scripts/ci-platform-chat-support-e3-e2e.mjs
          node scripts/ci-platform-wallet-groups-e4-e2e.mjs
          node scripts/ci-first-100-routes-f1-e2e.mjs
          node scripts/ci-operations-mutations-g1-e2e.mjs
          node scripts/ci-v9-functional-g2-e2e.mjs
          node scripts/ci-v9-collaboration-privacy-g3-e2e.mjs
          node scripts/ci-v11-private-h1-a.mjs
          node scripts/ci-v11-private-h1-b.mjs
          node scripts/ci-resilience-admin-h2-e2e.mjs
          node scripts/ci-first200-h3-growth-security.mjs
          node scripts/ci-first200-h3-kds-dispatch.mjs
          node scripts/ci-last52-j1-e2e.mjs
      - name: Kali manual PM2 updater syntax and non-stage fail-closed
        run: |
          bash -n scripts/actualizar.sh
          if bash scripts/actualizar.sh --plan >/tmp/tala-unsafe-stage-invocation.log 2>&1; then
            echo "ERROR: Kali stage updater accepted GitHub runner"; exit 1
          fi
          grep -q 'ABORT_STAGE_USER_ONLY' /tmp/tala-unsafe-stage-invocation.log
          echo "KALI_PM2_MANUAL_UPDATER_STAGE_USER_GUARD=PASS"
      - name: Python 1.6.2 pricing cap on isolated PostgreSQL Redis (independent process)
        env:
          COMMERCIAL_PRICING_V162_ENABLED: 'true'
        run: |
          set -euo pipefail
          node dist/server.js >/tmp/tala-node-v162-stage-e2e.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          node scripts/ci-cash-pickup-v162-e2e.mjs
      - name: Fail closed for LIVE credentials
        run: |
          ! grep -ER --include='*.ts' -E 'sk_live_|rk_live_|DATABASE_URL_PRODUCTION' src
