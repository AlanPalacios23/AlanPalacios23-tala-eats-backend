name: TALA EATS | one-shot external readiness probe (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-readiness-probe-win-20261015.yml
permissions:
  contents: read
jobs:
  external-readiness:
    if: ${{ github.repository == 'AlanPalacios23/AlanPalacios23-tala-eats-backend' && github.event_name == 'push' && github.event.head_commit.message == 'ci: one-shot read-only readiness probe on own Windows runner' }}
    runs-on: [self-hosted, Windows, X64, tala-eats-backend]
    timeout-minutes: 7
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout reviewed readiness diagnostic only
        uses: actions/checkout@v7
        with:
          ref: a3b816b909d6649ac6e4bf24985488f9dde037c2
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Synthetic self-tests and one read-only HTTPS GET
        run: |
          & .\scripts\qa-readiness-windows.ps1 -Probe
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_READY_PROBE_FAILED' }
