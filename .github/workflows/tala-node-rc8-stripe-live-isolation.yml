name: TALA EATS | RC8 Stripe LIVE isolated unit gates
on:
  pull_request:
    branches:
      - release/rc7-kali-test-candidate-final-20261023
    paths:
      - 'node-backend/src/live/**'
      - 'node-backend/tests/rc8-**'
      - 'node-backend/docs/RC8-**'
      - 'node-backend/scripts/rc8-**'
      - '.github/workflows/tala-node-rc8-stripe-live-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    name: RC8 isolated production primitives (NO LIVE KEYS / NO CHARGES)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - name: Dependencies pinned
        run: npm ci --no-audit --no-fund
      - name: Prisma generate and schema validate without DB connection
        run: |
          npm run generate
          npm run db:validate
      - name: Strict TypeScript
        run: npm run build
      - name: Bash syntax of RC8 installers and activation gate
        run: |
          bash -n scripts/rc8-kali-install-candidate.sh
          bash -n scripts/rc8-kali-next-deployment-preflight.sh
          bash -n scripts/rc8-kali-live-activation-gate.sh
          if bash scripts/rc8-kali-live-activation-gate.sh --activate; then exit 1; fi
      - name: Entire unit suite including RC8 LIVE (all synthetic)
        run: npm test
      - name: RC8.7 staging and LIVE isolation regression (single public runtime)
        run: |
          set -euo pipefail
          # Previously this workflow prohibited ANY live import in app.ts.
          # That check is obsolete now that RC8.6 mounts production-only
          # signed webhooks while NODE_ENV=staging stays completely isolated.
          # Enforce the runtime guard rather than banning imports.
          node scripts/release-readiness.mjs --stage
          node --test tests/rc8-locked-runtime.test.mjs tests/rc8-production-pm2-wiring.test.mjs tests/rc8-public-pm2-upgrade.test.mjs
          grep -Fq "config.NODE_ENV==='production'?buildLiveRuntimeDependencies():null" src/app.ts
          grep -Fq 'STAGING_MONEY_WRITES_FORBIDDEN' src/config.ts
          grep -Fq 'STAGING_REQUIRES_STRIPE_TEST_KEY' src/config.ts
          grep -Fq 'STAGING_REQUIRES_STRIPE_TEST_PUBLISHABLE' src/config.ts
          grep -Fq 'LIVE_PRODUCTION_POSTGRES_ISOLATION_REQUIRED' src/config.ts
          grep -Fq 'LIVE_PRODUCTION_REDIS_ISOLATION_REQUIRED' src/config.ts
          grep -Fq 'LIVE_CONNECT_PAYOUTS_REQUIRE_SEPARATE_AUDIT' src/config.ts
          grep -Fq 'app.use(\x27/api/v1/payments/stripe\x27,buildIsolatedWebhookRouter(' src/app.ts
          grep -Fq 'STRIPE_FINANCIAL_WRITES_ENABLED' src/app.ts
          echo RC87_PRODUCTION_ISOLATION_FAIL_CLOSED=PASS
