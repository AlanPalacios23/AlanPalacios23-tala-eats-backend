name: TALA EATS | V3 last blockers offline QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/kali_v3_last_blockers_readonly.py'
      - 'scripts/test_kali_v3_last_blockers_readonly.py'
      - '.github/workflows/kali-v3-last-blockers-qa.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe:
    name: V3 last blockers classification 12 cases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile scripts/kali_v3_last_blockers_readonly.py scripts/test_kali_v3_last_blockers_readonly.py
      - run: python scripts/test_kali_v3_last_blockers_readonly.py
