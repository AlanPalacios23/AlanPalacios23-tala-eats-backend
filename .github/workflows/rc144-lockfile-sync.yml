name: RC144 - secure Sharp lock refresh
on:
  push:
    branches: [feat/rc144-driver-avatar-persistent-backend-20261030]
    paths: [.github/workflows/rc144-lockfile-sync.yml]
permissions:
  contents: write
jobs:
  secure-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recompute auditable lock, verify clean install, fail on HIGH alerts
        run: |
          set -euo pipefail
          cd node-backend
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm ci --no-fund --no-audit
          npm audit --omit=dev --audit-level=high --no-fund
          node -e "const p=require('./package.json'),l=require('./package-lock.json');if(p.dependencies.sharp!=='0.35.5'||l.packages['node_modules/sharp']?.version!=='0.35.5')process.exit(1)"
      - name: Commit generated lock and do not touch other files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- node-backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(rc144): pin patched sharp 0.35.5 and passing npm audit"
            git push origin HEAD:feat/rc144-driver-avatar-persistent-backend-20261030
          fi
