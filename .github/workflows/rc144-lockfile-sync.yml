name: RC144 - regenerate exact avatar dependency lockfile
on:
  push:
    branches:
      - feat/rc144-driver-avatar-persistent-backend-20261030
    paths:
      - .github/workflows/rc144-lockfile-sync.yml
permissions:
  contents: write
jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - name: Regenerate exact transitive versions (no install scripts)
        run: |
          set -euo pipefail
          cd node-backend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package.json'), l=require('./package-lock.json');if(l.packages[''].dependencies.sharp!==p.dependencies.sharp)process.exit(1);"
      - name: Commit changed lock only back to RC144 branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- node-backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(rc144): lock exact Sharp dependencies from npm registry"
            git push origin HEAD:feat/rc144-driver-avatar-persistent-backend-20261030
          fi
