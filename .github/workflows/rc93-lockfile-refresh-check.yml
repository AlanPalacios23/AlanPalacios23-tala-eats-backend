name: RC93 isolated dependency remediation proof

on:
  push:
    branches: [feat/rc93-backend-security-hardening-20261028]
    paths:
      - '.github/workflows/rc93-lockfile-refresh-check.yml'
permissions:
  contents: read

jobs:
  lockfile-refresh-proof:
    name: Refresh lockfile in ephemeral runner only (no commits)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node-backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - name: Locally select fixed patch dependencies
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='package.json';
          const p=JSON.parse(readFileSync(path,'utf8'));
          p.dependencies['@prisma/adapter-pg']='7.10.1';
          p.dependencies['@prisma/client']='7.10.1';
          p.devDependencies.prisma='7.10.1';
          p.dependencies.zod='4.6.7';
          writeFileSync(path,JSON.stringify(p,null,2)+'\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Verify no HIGH or CRITICAL npm advisories
        run: npm audit --omit=dev --audit-level=high --no-fund
      - name: Compile and unit test only with refreshed lock
        run: |
          npm ci --no-audit --no-fund
          npm run generate
          npm run db:validate
          npm run build
          npm test
      - name: Emit reproducible UTF8 package and lock snapshots
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          for(const name of ['package.json','package-lock.json']){
            const tag=name==='package.json'?'PKG':'LOCK';
            console.log('RC93_BEGIN_'+tag+'_B64');
            console.log(readFileSync(name).toString('base64'));
            console.log('RC93_END_'+tag+'_B64');
          }
          JS
