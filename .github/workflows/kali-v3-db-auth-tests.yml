name: TALA EATS | V3 read-only DB diagnostic fixtures

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/kali_v3_db_auth_readonly.py'
      - 'scripts/test_kali_v3_db_auth_readonly.py'
      - '.github/workflows/kali-v3-db-auth-tests.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-fixtures:
    name: V3 read-only PostgreSQL query privacy checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile scripts/kali_v3_db_auth_readonly.py scripts/test_kali_v3_db_auth_readonly.py
      - run: python scripts/test_kali_v3_db_auth_readonly.py
