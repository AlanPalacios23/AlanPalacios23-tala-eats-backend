name: RC8.12 P0 | Readiness Worker Gate

on:
  pull_request:
    paths:
      - 'node-backend/src/app.ts'
      - 'node-backend/src/runtime-readiness.ts'
      - 'node-backend/tests/rc812-runtime-readiness.test.mjs'
      - '.github/workflows/rc812-ready-worker-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: node-backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Prisma client and TypeScript
        run: |
          npm run generate
          npm run build
      - name: RC8.12 worker-readiness regressions
        run: node --test tests/rc812-runtime-readiness.test.mjs
      - name: Full existing Node regression suite
        run: npm test
