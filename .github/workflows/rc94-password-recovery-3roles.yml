name: Tala Eats RC9.4 | Password recovery - 3 roles

on:
  push:
    branches: [feat/rc94-password-recovery-all-roles-20261028]
    paths:
      - 'node-backend/**'
      - '.github/workflows/rc94-password-recovery-3roles.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  reset-three-roles:
    name: Isolated HTTP PostgreSQL Redis + Customer Restaurant Driver
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tala_node_stage
          POSTGRES_PASSWORD: stage-ci-pass
          POSTGRES_DB: tala_node_stage
        ports: ['15435:5432']
        options: >-
          --health-cmd "pg_isready -U tala_node_stage -d tala_node_stage"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:8
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: node-backend
    env:
      NODE_ENV: staging
      CI: 'true'
      HOST: 127.0.0.1
      PORT: '18190'
      DATABASE_URL: postgresql://tala_node_stage:stage-ci-pass@127.0.0.1:15435/tala_node_stage
      REDIS_URL: redis://:stage-ci-redis@127.0.0.1:16379/0
      AUTH_V02_ENABLED: 'true'
      AUTH_JWT_SECRET: ci-only-rc94-auth-contract-key-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      STRIPE_FINANCIAL_WRITES_ENABLED: 'false'
      STRIPE_LIVE_ENABLED: 'false'
      STRIPE_CONNECT_TRANSFERS_ENABLED: 'false'
      STAGE_EMAIL_DELIVERY_MODE: disabled
      LIVE_AUTH_EMAIL_DELIVERY_MODE: disabled
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - name: Install exactly locked packages
        run: npm ci --no-audit --no-fund
      - name: Secure ephemeral Redis instance
        run: |
          node --input-type=module <<'JS'
          import {Redis} from 'ioredis';
          const redis=new Redis('redis://127.0.0.1:16379');
          await redis.config('SET','requirepass','stage-ci-redis');
          redis.disconnect();
          const secured=new Redis(process.env.REDIS_URL);
          if(await secured.ping()!=='PONG')throw Error('REDIS_MISSING');
          secured.disconnect();
          JS
      - name: Prisma migrate against ephemeral DB; compile
        run: |
          npm run generate
          npm run db:migrate:deploy
          npm run build
      - name: Full Node regression and pure recovery contract
        run: npm test
      - name: Mock Resend delivery with explicit staging allowlist
        env:
          STAGE_EMAIL_DELIVERY_MODE: resend
          STAGE_EMAIL_RESEND_API_KEY: re_ci-only-fake-key-no-http
          STAGE_EMAIL_FROM: noreply@example.com
          STAGE_EMAIL_ALLOWED_RECIPIENTS: rc94-inbox@example.com
        run: node scripts/ci-rc94-mail-provider-mock-pg15.mjs
      - name: Real 3-role recovery using HTTP, Redis and PostgreSQL
        run: |
          set -euo pipefail
          node dist/server.js >"$RUNNER_TEMP/rc94-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18190/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18190/api/v1/health >/dev/null
          node scripts/ci-rc94-password-recovery-3roles-pg15.mjs
      - name: Enforce zero LIVE money and no outbound mail
        run: |
          test "$STRIPE_FINANCIAL_WRITES_ENABLED" = false
          test "$LIVE_AUTH_EMAIL_DELIVERY_MODE" = disabled
          echo RC94_ALL_ROLES_PASSWORD_RECOVERY=PASS
