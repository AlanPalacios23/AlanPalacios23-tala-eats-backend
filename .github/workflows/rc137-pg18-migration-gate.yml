name: "TALA EATS RC13.7 | PostgreSQL 18 Finance Migration Gate"
on:
  push:
    branches: [feat/rc137-payment-delivery-e2e-20261029]
    paths:
      - ".github/workflows/rc137-pg18-migration-gate.yml"
      - "node-backend/scripts/ci-rc137-pg18-migrations.mjs"
      - "node-backend/prisma/**"
  pull_request:
    branches: [release/rc135-finance-pilot-candidate-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc137-pg18-finance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-pg18:
    name: "PG18 migrations + immutable balanced finance ledger"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rc137_ci
          POSTGRES_PASSWORD: ci-disposable-pg18-only
          POSTGRES_DB: tala_rc137_pg18
        ports: ["15455:5432"]
        options: >-
          --health-cmd "pg_isready -U rc137_ci -d tala_rc137_pg18"
          --health-interval 5s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: node-backend
    env:
      GITHUB_ACTIONS: "true"
      NODE_ENV: staging
      DATABASE_URL: "postgresql://rc137_ci:ci-disposable-pg18-only@127.0.0.1:15455/tala_rc137_pg18"
      AUTH_JWT_SECRET: "rc137-disposable-pg18-auth-aaaaaaaaaaaabbbbbbbbbbbb"
      STRIPE_LIVE_ENABLED: "false"
      STRIPE_FINANCIAL_WRITES_ENABLED: "false"
      STRIPE_CONNECT_TRANSFERS_ENABLED: "false"
      STRIPE_REFUNDS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - name: Compile and apply full migrations to disposable PostgreSQL 18
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run generate
          npm run db:validate
          npm run db:migrate:deploy
          npm run db:migrate:deploy
          npm run build
      - name: Validate PG18 ledger invariants and cash custody schema
        run: |
          set -euo pipefail
          node --check scripts/ci-rc137-pg18-migrations.mjs
          node scripts/ci-rc137-pg18-migrations.mjs
      - name: Confirm no financial LIVE flags
        run: |
          test "$NODE_ENV" = staging
          test "$STRIPE_LIVE_ENABLED" = false
          test "$STRIPE_FINANCIAL_WRITES_ENABLED" = false
          test "$STRIPE_CONNECT_TRANSFERS_ENABLED" = false
          test "$STRIPE_REFUNDS_ENABLED" = false
