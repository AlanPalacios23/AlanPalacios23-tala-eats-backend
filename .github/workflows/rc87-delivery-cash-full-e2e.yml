name: TALA EATS RC8.7 | Cash Delivery Full E2E (CI ONLY)
on:
  push:
    branches: [feat/rc87-delivery-cash-stage-flow-20261024, fix/rc126-real-onboarding-role-isolation-20261029]
permissions:
  contents: read
jobs:
  cash-delivery:
    name: Customer merchant driver geodistance ledger PG15 Redis8
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: tala_node_stage
          POSTGRES_PASSWORD: stage-ci-pass
          POSTGRES_DB: tala_node_stage
        ports: ['15435:5432']
        options: >-
          --health-cmd "pg_isready -U tala_node_stage -d tala_node_stage"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:8
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    defaults:
      run:
        working-directory: node-backend
    env:
      NODE_ENV: staging
      HOST: 127.0.0.1
      PORT: '18190'
      DATABASE_URL: postgresql://tala_node_stage:stage-ci-pass@127.0.0.1:15435/tala_node_stage
      REDIS_URL: redis://:stage-ci-redis@127.0.0.1:16379/0
      STRIPE_FINANCIAL_WRITES_ENABLED: 'false'
      STRIPE_LIVE_ENABLED: 'false'
      STRIPE_CONNECT_TRANSFERS_ENABLED: 'false'
      AUTH_V02_ENABLED: 'true'
      MARKETPLACE_B_ENABLED: 'true'
      STAGE_PICKUP_CASH_CHECKOUT_ENABLED: 'true'
      STAGE_DRIVER_DELIVERY_ENABLED: 'true'
      STAGE_DELIVERY_CASH_CHECKOUT_ENABLED: 'true'
      COMMERCIAL_PRICING_V162_ENABLED: 'true'
      AUTH_JWT_SECRET: ci-only-auth-secret-not-shared-with-prod-xxxxxxxxxxxxxxxxxxxxxxxxxx
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: node-backend/package-lock.json
      - name: Strict route inventory unchanged
        run: |
          python3 scripts/python_route_inventory.py --check
          python3 scripts/node_route_coverage.py --check
      - name: Frozen dependencies and isolated migrations
        run: |
          npm ci --no-audit --no-fund
          npm run generate
          npm run db:validate
          npm run db:migrate:deploy
      - name: Compile and test without Stripe real credentials
        env:
          # Production-isolation tests must not inherit an enabled stage-only checkout.
          STAGE_DELIVERY_CASH_CHECKOUT_ENABLED: 'false'
        run: |
          npm run build
          npm test
      - name: Protect disposable Redis with password
        run: |
          node --input-type=module -e '
            import {Redis} from "ioredis";
            const r=new Redis("redis://127.0.0.1:16379");
            await r.config("SET","requirepass","stage-ci-redis");
            r.disconnect();
            const secured=new Redis(process.env.REDIS_URL);
            if(await secured.ping()!=="PONG")process.exitCode=1;
            secured.disconnect();
          '
      - name: Full customer -> restaurant -> driver -> PIN -> ledger delivery
        run: |
          set -euo pipefail
          node dist/server.js > /tmp/tala-rc87-delivery-api.log 2>&1 &
          api_pid=$!
          node dist/worker.js > /tmp/tala-rc87-delivery-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$api_pid" "$worker_pid" 2>/dev/null || true' EXIT
          node scripts/ci-rc87-cash-delivery-e2e.mjs || {
            tail -n 130 /tmp/tala-rc87-delivery-api.log | sed -E 's/(sk|rk|pk)_(test|live)_[A-Za-z0-9]+/[KEY REDACTED]/g'
            exit 1
          }
      - name: Fail closed if any production payment flag entered staging
        run: |
          node -e "import('./dist/config.js').then(x=>{if(x.config.STRIPE_LIVE_ENABLED!=='false'||x.config.STRIPE_FINANCIAL_WRITES_ENABLED!=='false'||x.config.STRIPE_CONNECT_TRANSFERS_ENABLED!=='false')process.exit(1)})"
