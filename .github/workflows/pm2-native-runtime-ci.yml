name: Tala Eats | PM2 native Linux smoke (without Docker)

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/pm2/**'
      - 'scripts/deploy_pm2_stage.sh'
      - '.github/workflows/pm2-native-runtime-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pm2-real-runtime:
    name: Real PM2 + FastAPI + worker, native PostgreSQL/Redis, isolated
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native dependencies, no Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq postgresql-16 postgresql-client-16 redis-server
          sudo pg_ctlcluster 16 main start || true
          sudo systemctl start redis-server || true
          pg_isready -h 127.0.0.1 -p 5432
          redis-cli -h 127.0.0.1 PING | grep -qx PONG
          npm install -g pm2@6
          pm2 --version
      - name: Create disposable database and safe local configuration
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE tala_pm2_ci LOGIN PASSWORD 'isolated-test-not-live';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE talaeats_stage OWNER tala_pm2_ci;"
          mkdir -p "$HOME/.config" "$HOME/talaeats-stage-media"
          umask 077
          cat > "$HOME/.config/talaeats-pm2-stage.env" <<EOF
          ENVIRONMENT=production
          DEBUG=false
          DATABASE_URL=postgresql+psycopg://tala_pm2_ci:isolated-test-not-live@127.0.0.1:5432/talaeats_stage
          REDIS_URL=redis://127.0.0.1:6379/1
          JWT_SECRET=ci_disposable_pm2_native_runtime_secret_over_40_chars
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ORIGINS=https://stage-ci.example.invalid
          PUBLIC_BASE_URL=https://stage-ci.example.invalid
          FRONTEND_URL=https://stage-ci.example.invalid
          MEDIA_DIR=$HOME/talaeats-stage-media
          STRIPE_ENABLED=false
          STRIPE_CONNECT_ENABLED=false
          STRIPE_CONNECT_SELF_SERVICE_ENABLED=false
          WITHDRAWALS_PREVIEW_ENABLED=false
          WITHDRAWALS_EXECUTION_ENABLED=false
          WITHDRAWALS_LIVE_ENABLED=false
          CASH_CHECKOUT_ENABLED=false
          REQUIRE_ONLINE_PAYMENTS=false
          SEED_DEMO_DATA=false
          AUTO_MIGRATE_ON_START=false
          EOF
          chmod 600 "$HOME/.config/talaeats-pm2-stage.env"
          bash deploy/pm2/validate-stage.sh
          test "$(stat -c %a "$HOME/.config/talaeats-pm2-stage.env")" = 600
          echo PM2_STAGE_NATIVE_GUARD_PASS
      - name: Install real Python backend and manually migrate temporary PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python3.13 -m venv backend/.venv
          backend/.venv/bin/pip install -q -r backend/requirements.txt
          (
            cd backend
            set -a
            source "$HOME/.config/talaeats-pm2-stage.env"
            set +a
            .venv/bin/alembic upgrade head
            .venv/bin/alembic current --check-heads
          )
          echo PM2_STAGE_NATIVE_POSTGRES_ALEMBIC_PASS
      - name: Start API and worker under actual PM2, validate HTTP and restart
        shell: bash
        run: |
          set -euo pipefail
          pm2 start deploy/pm2/ecosystem.config.cjs
          for i in $(seq 1 35); do
            if curl -fsS --max-time 2 http://127.0.0.1:18090/api/v1/ready -o "$RUNNER_TEMP/ready.json"; then
              if python3.13 - "$RUNNER_TEMP/ready.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v.get('ready') is True and v.get('database') is True and v.get('redis') is True
          PY
              then break; fi
            fi
            sleep 2
          done
          test -s "$RUNNER_TEMP/ready.json"
          python3.13 - "$RUNNER_TEMP/ready.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v.get('ready') is True and v.get('database') is True and v.get('redis') is True, v
          print('PM2_REAL_API_READY_PASS')
          PY
          pm2 jlist | python3.13 -c 'import sys,json; d={p["name"]:p["pm2_env"]["status"] for p in json.load(sys.stdin)}; assert d.get("talaeats-pm2-api-stage")=="online" and d.get("talaeats-pm2-worker-stage")=="online",d; print("PM2_REAL_API_WORKER_PASS")'
          pm2 restart deploy/pm2/ecosystem.config.cjs --update-env
          for i in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:18090/api/v1/ready -o "$RUNNER_TEMP/restarted.json"; then
              if python3.13 - "$RUNNER_TEMP/restarted.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v.get('ready') is True and v.get('database') is True and v.get('redis') is True
          PY
              then break; fi
            fi
            sleep 2
          done
          python3.13 - "$RUNNER_TEMP/restarted.json" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1]))
          assert v.get('ready') is True and v.get('database') is True and v.get('redis') is True
          print('PM2_REAL_RESTART_PASS')
          PY
          pm2 jlist | python3.13 -c 'import sys,json; d={p["name"]:p["pm2_env"]["status"] for p in json.load(sys.stdin)}; assert d.get("talaeats-pm2-api-stage")=="online" and d.get("talaeats-pm2-worker-stage")=="online"'
      - name: Clean ephemeral processes
        if: always()
        shell: bash
        run: |
          pm2 delete talaeats-pm2-api-stage || true
          pm2 delete talaeats-pm2-worker-stage || true
          pm2 kill || true
          echo 'Ephemeral Linux PM2 smoke only; no Kali SSH, Cloudflare DNS, or real payments.'
