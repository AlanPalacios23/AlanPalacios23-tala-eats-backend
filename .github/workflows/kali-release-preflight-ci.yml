name: TALA EATS | Kali release preflight (sin despliegue)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/kali_release_inventory_readonly.sh'
      - 'scripts/kali_compose_topology_readonly.py'
      - 'scripts/kali_proxy_trust_readonly.py'
      - 'scripts/kali_release_candidate_plan_readonly.py'
      - 'scripts/kali_pin_rollback_images.py'
      - 'scripts/kali_backup_encrypted.sh'
      - 'docs/KALI_GITHUB_RELEASE_ROLLBACK.md'
      - '.github/workflows/kali-release-preflight-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/kali_release_inventory_readonly.sh'
      - 'docs/KALI_GITHUB_RELEASE_ROLLBACK.md'
      - '.github/workflows/kali-release-preflight-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-preflight:
    name: Validar sintaxis del inventario Kali (sin SSH)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout privado
        uses: actions/checkout@v4
      - name: Sintaxis Bash
        run: |
          bash -n scripts/kali_release_inventory_readonly.sh
          bash -n scripts/kali_backup_encrypted.sh
          bash scripts/kali_backup_encrypted.sh --self-test
      - name: Rechazar secretos en fuentes
        run: python3 scripts/security_preflight.py --root .
      - name: Python compilación y sanitización de Compose
        run: |
          python3 -m py_compile scripts/kali_compose_topology_readonly.py scripts/kali_release_candidate_plan_readonly.py scripts/kali_pin_rollback_images.py scripts/kali_proxy_trust_readonly.py
          python3 scripts/kali_compose_topology_readonly.py --self-test
          python3 scripts/kali_proxy_trust_readonly.py --self-test
          python3 scripts/kali_release_candidate_plan_readonly.py --self-test
          python3 scripts/kali_pin_rollback_images.py --self-test
      - name: Confirmar que no se accede a Kali ni Stripe
        run: |
          echo 'READONLY_PREFLIGHT_CI_PASS'
          echo 'Sin credenciales, sin SSH, sin deploy, sin rollback ni backups.'
