name: TALA EATS | GitHub Actions -> Tailscale SSH -> Kali GREEN

on:
  workflow_run:
    workflows: ['TALA EATS Backend | QA aislado']
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Comprobar SSH sin desplegar'
        required: true
        type: choice
        options: [probe]
        default: probe

permissions:
  contents: read
  actions: read

concurrency:
  group: talaeats-green-ssh-cd
  cancel-in-progress: false

jobs:
  gate:
    name: SHA main + cinco CI exitosos (o probe)
    if: >-
      [[ github.event_name == 'workflow_dispatch' ||
         (vars.TALAEATS_GREEN_CD_ENABLED == 'YES' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success') ]]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Validar commit y CI; no SSH/no secretos
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('sha', 'probe');
              return;
            }
            const {owner, repo} = context.repo;
            const run = context.payload.workflow_run;
            const sha = run?.head_sha;
            if (run?.head_repository?.full_name !== owner + '/' + repo ||
                run?.event !== 'push' || run?.head_branch !== 'main' ||
                run?.conclusion !== 'success' || !/^[0-9a-f]{40}$/.test(sha || '')) {
              return core.setFailed('Disparo no autorizado o SHA inesperado');
            }
            const main = await github.rest.repos.getBranch({owner, repo, branch:'main'});
            if (main.data.commit.sha !== sha) {
              return core.setFailed('Commit main ya cambió: rechazar despliegue obsoleto');
            }
            const required = [
              'TALA EATS Backend | QA aislado',
              'TALA EATS Backend | PostgreSQL Redis Gate',
              'TALA EATS Backend | Finanzas PostgreSQL + Redis (CI aislado)',
              'TALA EATS Backend | Container Build Gate',
              'TALA EATS Backend | Security Audit',
            ];
            for (let attempt=0; attempt<108; attempt++) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, head_sha:sha, event:'push', per_page:100,
              }, response => response.data.workflow_runs);
              const failed = runs.filter(x => required.includes(x.name) &&
                x.head_sha === sha && x.head_branch === 'main' &&
                x.status === 'completed' && x.conclusion !== 'success');
              if (failed.length) {
                return core.setFailed('Un gate CI falló/canceló en SHA exacto');
              }
              const missing = required.filter(name => !runs.some(x =>
                x.name === name && x.head_sha === sha && x.head_branch === 'main' &&
                x.status === 'completed' && x.conclusion === 'success'));
              if (missing.length === 0) {
                core.setOutput('sha', sha);
                core.info('GREEN cinco gates PASS: ' + sha.slice(0,12));
                return;
              }
              if (attempt < 107) await new Promise(resolve => setTimeout(resolve, 25000));
            }
            core.setFailed('NO-GO: falta alguno de los cinco controles CI');

  ssh:
    name: Acceso privado SSH restringido a Kali; nunca modificar TALA v3
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    environment: talaeats-production
    env:
      TARGET_SHA: ${{ needs.gate.outputs.sha }}
      GREEN_CD_ENABLED: ${{ vars.TALAEATS_GREEN_CD_ENABLED }}
      SSH_HOST: ${{ secrets.TALAEATS_KALI_SSH_HOST }}
      SSH_PORT: ${{ secrets.TALAEATS_KALI_SSH_PORT }}
      SSH_USER: ${{ secrets.TALAEATS_KALI_SSH_USER }}
      SSH_KEY: ${{ secrets.TALAEATS_KALI_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.TALAEATS_KALI_SSH_KNOWN_HOSTS }}
    steps:
      - name: Conexión privada Tailscale de runner efímero
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:talaeats-ci
      - name: SSH host-key pinning / credenciales efímeras
        shell: bash
        run: |
          set -euo pipefail
          ${{ -n "$SSH_HOST" && -n "$SSH_KEY" && -n "$SSH_KNOWN_HOSTS" && -n "$SSH_USER" }}
          ${{ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ }}
          ${{ "$SSH_PORT" =~ ^[0-9]{1,5}$ }}
          (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 ))
          # Never connect to local/LAN/private-public arbitrary hosts;
          # Tailscale IP or MagicDNS only.
          [[ "$SSH_HOST" =~ ^100\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ||
             "$SSH_HOST" =~ ^[a-z0-9.-]+\.ts\.net$ ]]
          if ${{ "[[ github.event_name }}" != "workflow_dispatch" ]]; then
            ${{ "$GREEN_CD_ENABLED" == "YES" }}
            ${{ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ }}
          fi
          mkdir -p "$RUNNER_TEMP/tala-green-ssh"
          chmod 700 "$RUNNER_TEMP/tala-green-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/tala-green-ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/tala-green-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/tala-green-ssh/"*
      - name: Ejecutar solo receptor GREEN
        shell: bash
        run: |
          set -euo pipefail
          if ${{ "[[ github.event_name }}" == "workflow_dispatch" ]]; then
            command="talaeats-green-cd probe"
          else
            command="talaeats-green-cd deploy $TARGET_SHA"
          fi
          ssh -T -i "$RUNNER_TEMP/tala-green-ssh/id_ed25519" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/tala-green-ssh/known_hosts" \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ClearAllForwardings=yes -o RequestTTY=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 \
            -p "$SSH_PORT" -- "$SSH_USER@$SSH_HOST" "$command"
      - name: Borrar material SSH temporal
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/tala-green-ssh"
