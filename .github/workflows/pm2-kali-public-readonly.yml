name: TALA EATS | Kali public health (GET only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pm2-kali-public-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-get-health:
    name: HTTPS/TLS GET /health and /ready (no SSH, no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify TLS, HTTPS and JSON readiness on existing public API
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import socket
          import urllib.error
          import urllib.request

          host = "talaeats.alan-palacios-dev.com"
          try:
              resolved = socket.getaddrinfo(host, 443, type=socket.SOCK_STREAM)
              assert resolved
              print("KALI_PUBLIC_DNS_PASS")
          except Exception as exc:
              raise SystemExit(f"PUBLIC_DNS_FAIL: {type(exc).__name__}") from None

          for endpoint in ("health", "ready"):
              url = f"https://{host}/api/v1/{endpoint}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "TalaEats-CI-ReadOnly/1.0"})
                  with urllib.request.urlopen(req, timeout=18) as response:
                      code = response.status
                      raw = response.read(1048576)
                  assert code == 200, f"HTTP {code}"
                  payload = json.loads(raw)
                  assert isinstance(payload, dict)
                  if endpoint == "ready":
                      assert payload.get("ready") is True
                      assert payload.get("database") is True
                      assert payload.get("redis") is True
                  else:
                      assert payload.get("status") == "ok"
                  print(f"KALI_PUBLIC_{endpoint.upper()}_PASS HTTP=200 TLS=verified")
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"KALI_PUBLIC_{endpoint.upper()}_FAIL HTTP={exc.code}") from None
              except Exception as exc:
                  raise SystemExit(f"KALI_PUBLIC_{endpoint.upper()}_FAIL {type(exc).__name__}: {str(exc)[:150]}") from None

          print("KALI_PUBLIC_READONLY_PASS_NO_SSH_NO_DEPLOY")
          PY
