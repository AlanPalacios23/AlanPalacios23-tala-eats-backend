name: TALA EATS | Kali V3 connection path privacy diagnostics (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/kali_v3_db_path_readonly.py'
      - 'scripts/test_kali_v3_db_path_readonly.py'
      - '.github/workflows/kali-v3-db-path-qa.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-path:
    name: V3 network / DNS / TCP / SQL probe 20 fail-safe fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile scripts/kali_v3_db_path_readonly.py scripts/test_kali_v3_db_path_readonly.py
      - run: python scripts/test_kali_v3_db_path_readonly.py
