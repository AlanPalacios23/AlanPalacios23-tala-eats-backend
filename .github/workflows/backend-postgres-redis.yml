name: TALA EATS Backend | PostgreSQL Redis Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-postgres-redis.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-postgres-redis.yml'

permissions:
  contents: read

concurrency:
  group: talaeats-db-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-redis-qa:
    name: PostgreSQL 16 + Redis 8 + Alembic (datos efímeros)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: talaqa
          POSTGRES_PASSWORD: qa-only-local
          POSTGRES_DB: talaqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talaqa -d talaqa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ENVIRONMENT: development
      DEBUG: 'false'
      DATABASE_URL: postgresql+psycopg://talaqa:qa-only-local@127.0.0.1:5432/talaqa
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: 'qa-ephemeral-jwt-only-not-to-be-used-in-production-2026'
      SEED_DEMO_DATA: 'false'
      POSTGIS_ENABLED: 'false'
      STRIPE_ENABLED: 'false'
      STRIPE_CONNECT_ENABLED: 'false'
      STRIPE_CONNECT_SELF_SERVICE_ENABLED: 'false'
      STRIPE_SECRET_KEY: ''
      STRIPE_PUBLISHABLE_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      STRIPE_CONNECT_WEBHOOK_SECRET: ''
      MERCADOPAGO_ACCESS_TOKEN: ''
      WITHDRAWALS_PREVIEW_ENABLED: 'false'
      WITHDRAWALS_EXECUTION_ENABLED: 'false'
      WITHDRAWALS_LIVE_ENABLED: 'false'
      REQUIRE_SMTP: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout privado
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Verificar que el ambiente es efímero y sin Stripe LIVE
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATABASE_URL" == 'postgresql+psycopg://talaqa:qa-only-local@127.0.0.1:5432/talaqa' ]]
          [[ "$REDIS_URL" == 'redis://127.0.0.1:6379/0' ]]
          [[ "$ENVIRONMENT" == 'development' ]]
          [[ "$STRIPE_ENABLED" == 'false' ]]
          [[ "$WITHDRAWALS_EXECUTION_ENABLED" == 'false' ]]
          [[ -z "$STRIPE_SECRET_KEY" ]]
          [[ -z "$MERCADOPAGO_ACCESS_TOKEN" ]]
          echo "QA_EPHEMERAL_ONLY_PASS"
      - name: Alembic migration HEAD en PostgreSQL 16
        run: python -m alembic upgrade head
      - name: Pruebas PostgreSQL Redis roles integridad y health
        run: python -m qa.postgres_redis_smoke
      - name: Verificar Alembic current
        run: python -m alembic current
      - name: Fase 2 guardia historial migraciones PostgreSQL (sin red)
        run: python -m qa.phase2_historical_upgrade_smoke --self-test
      - name: Fase 2 transicion f20 a f21 en DB efimera separada (no Kali)
        run: python -m qa.phase2_historical_upgrade_smoke
      - name: QA Fase 1 multi-worker PostgreSQL + Redis disponible (sintetico)
        run: python -m qa.phase1_concurrency_smoke --mode normal
      - name: QA Fase 1 retry post-COMMIT sin Redis (sintetico)
        env:
          REDIS_URL: redis://127.0.0.1:6399/0
        run: python -m qa.phase1_concurrency_smoke --mode redis-outage
      - name: Obtener tag verificado de Fase 1 para prueba de rollback (solo Git)
        run: git fetch --no-tags --depth=1 origin refs/tags/tala-eats-backend-fase1-p0-rc1-20261015:refs/tags/tala-eats-backend-fase1-p0-rc1-20261015
      - name: Fase 2 API + worker despliegue/fallo/rollback entre dos SHA en QA
        env:
          GITHUB_ACTIONS: 'true'
        run: python -m qa.phase2_staging_rollback_drill
      - name: Fase 2 precios v1.6.2 y libro de pagos PostgreSQL (sintetico)
        run: python -m qa.phase2_pricing_pg_smoke

      - name: Fase 2 F2.09 verificar expectativas ledger vs custodia real (read-only)
        run: python -m qa.phase2_reconciliation_readonly
      - name: Fase 2 F2.10 efectivo: custodia hipotetica y hold de netting sin escrituras
        run: python -m qa.phase2_cash_exposure_readonly
      - name: Fase 2 F2.03 guardas de respaldo cifrado (solo datos sinteticos)
        run: python -m qa.phase2_backup_restore_smoke --self-test
      - name: Fase 2 F2.03 pg_dump + media AES256 y restore PostgreSQL separado (no Kali)
        run: python -m qa.phase2_backup_restore_smoke
