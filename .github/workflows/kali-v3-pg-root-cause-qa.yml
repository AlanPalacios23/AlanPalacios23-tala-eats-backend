name: TALA EATS | Kali V3 PostgreSQL rejection root cause (offline)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/kali_v3_pg_root_cause_readonly.py'
      - 'scripts/test_kali_v3_pg_root_cause_readonly.py'
      - '.github/workflows/kali-v3-pg-root-cause-qa.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    name: V3 PG rejection classifiers — safe fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m py_compile scripts/kali_v3_pg_root_cause_readonly.py scripts/test_kali_v3_pg_root_cause_readonly.py
      - run: python scripts/test_kali_v3_pg_root_cause_readonly.py
