name: TALA EATS | Fase1 one-shot draft RC (NO deploy)
on:
  push:
    branches:
      - 'ops/issue-fase1-rc-e153aa987168'
    paths:
      - '.github/workflows/one-shot-fase1-rc.yml'

permissions:
  contents: write
  actions: read
  checks: read

jobs:
  candidate:
    if: >-
      github.repository == 'AlanPalacios23/AlanPalacios23-tala-eats-backend' &&
      github.ref == 'refs/heads/ops/issue-fase1-rc-e153aa987168' &&
      github.event.head_commit.message == 'ci(rc): package approved Fase1 SHA as draft prerelease'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: 'AlanPalacios23/AlanPalacios23-tala-eats-backend'
      SOURCE_SHA: 'e153aa9871683f96d530cd46effaf4fdfb80a253'
      TAG_NAME: 'tala-eats-backend-fase1-p0-rc1-20261015'
      QA_RUN_ID: '38812315926'
      QA_ARTIFACT: 'talaeats-backend-ci-e153aa9871683f96d530cd46effaf4fdfb80a253'
    steps:
      - name: Checkout exact tested main SHA (not workflow's branch)
        uses: actions/checkout@v4
        with:
          ref: 'e153aa9871683f96d530cd46effaf4fdfb80a253'
          persist-credentials: false
      - name: Verify main and all required GitHub checks
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ "$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')" == "$SOURCE_SHA" ]]
          gh api "repos/$REPO/commits/$SOURCE_SHA/check-runs?per_page=100" > checks.json
          python3 - <<'PY'
          import json
          data = json.load(open("checks.json", encoding="utf-8"))
          expected = {
              "pytest FastAPI + SQLite aislado",
              "Sintaxis + secretos (solo código)",
              "PyPI OSV + Bandit static checks (read-only)",
              "PostgreSQL 16 + Redis 8 + contratos financieros",
              "Docker production image — build / non-root / offline smoke",
              "PostgreSQL 16 + Redis 8 + Alembic (datos efímeros)",
          }
          check_runs = data["check_runs"]
          successes = {
              x["name"] for x in check_runs
              if x["status"] == "completed" and x["conclusion"] == "success"
          }
          assert expected.issubset(successes), ("Missing required CI gates", sorted(expected-successes))
          assert not any(x["conclusion"] != "success" for x in check_runs), "Extra non-green check"
          print("FASE1_RELEASE_GATES_6_OF_6_PASS")
          PY
      - name: Download exact SHA Docker image and verify SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/dist
          gh run download "$QA_RUN_ID" --repo "$REPO" --name "$QA_ARTIFACT" --dir candidate/dist
          (cd candidate && sha256sum --check dist/SHA256SUMS)
          grep -Fxq "source_commit=$SOURCE_SHA" candidate/dist/PROVENANCE.txt
          test "$(find candidate/dist -maxdepth 1 -name '*.docker.tar.gz' -type f | wc -l)" -eq 1
          echo "FASE1_RC_IMAGE_SHA256_PASS"
      - name: Build candidate manifest and create immutable Git tag
        shell: bash
        run: |
          set -euo pipefail
          image_digest="$(cut -d ' ' -f 1 candidate/dist/SHA256SUMS)"
          cat > candidate/RELEASE_NOTES.md <<EOF
          # TALA EATS Backend · Fase 1 P0 RC1 — NO DESPLEGADA
          
          SHA fuente verificado: $SOURCE_SHA
          Git tag: $TAG_NAME
          Imagen Docker tar.gz SHA256: $image_digest
          GitHub Actions QA: https://github.com/$REPO/actions/runs/38812315968
          QA financiero NO-LIVE: https://github.com/$REPO/actions/runs/38812315907
          PostgreSQL16 + Redis8 + 2 workers: https://github.com/$REPO/actions/runs/38812315962
          Seguridad: https://github.com/$REPO/actions/runs/38812315908
          Docker artifact original: https://github.com/$REPO/actions/runs/$QA_RUN_ID
          Plan y riesgos: https://github.com/$REPO/blob/$SOURCE_SHA/docs/FASE1-P0-PROMOCION-SEGURA-2026-10-15.md
          
          F1.01/F1.02/F1.04/F1.06/F1.08: PASS en main. F1.03 exige inspeccion real del
          proxy Caddy/Cloudflare en Kali; public readiness devolvio HTTP 403.
          
          NO APROBADA PARA PRODUCCION: no iniciar Compose, migrations, retiros, bancos,
          pagos, Stripe LIVE ni operaciones de fondos. La restauracion aislada y el
          mecanismo automatico de cash/netting requieren aprobacion independiente.
          Rollback debe conservar API/worker previos y nunca restaurar asientos LIVE
          posteriores al respaldo ni hacer Alembic downgrade automatico.
          EOF
          if gh api "repos/$REPO/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            existing="$(gh api "repos/$REPO/git/ref/tags/$TAG_NAME" --jq .object.sha)"
            [[ "$existing" == "$SOURCE_SHA" ]] || { echo 'TAG_SHA_CONFLICT'; exit 1; }
          else
            gh api "repos/$REPO/git/refs" --method POST -f ref="refs/tags/$TAG_NAME" -f sha="$SOURCE_SHA" > /dev/null
          fi
          [[ "$(gh api "repos/$REPO/git/ref/tags/$TAG_NAME" --jq .object.sha)" == "$SOURCE_SHA" ]]
          echo "FASE1_RC_PINNED_GIT_TAG_PASS"
      - name: Create DRAFT prerelease with SHA verified image (never deploy)
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "Existing release; verifying before upload"
            gh release view "$TAG_NAME" --repo "$REPO" --json isDraft --jq '.isDraft' | grep -qx true
            gh release upload "$TAG_NAME" candidate/dist/*.docker.tar.gz candidate/dist/SHA256SUMS candidate/dist/PROVENANCE.txt --repo "$REPO" --clobber
          else
            gh release create "$TAG_NAME" \
              --repo "$REPO" --verify-tag --draft --prerelease \
              --title "TALA EATS Backend Fase 1 P0 RC1 (NO DESPLEGAR)" \
              --notes-file candidate/RELEASE_NOTES.md \
              candidate/dist/*.docker.tar.gz candidate/dist/SHA256SUMS candidate/dist/PROVENANCE.txt
          fi
          gh release view "$TAG_NAME" --repo "$REPO" --json isDraft,assets \
            --jq '{isDraft,assetNames:[.assets[].name]}'
          [[ "$(gh release view "$TAG_NAME" --repo "$REPO" --json isDraft --jq '.isDraft')" == "true" ]]
          echo "FASE1_DRAFT_PRERELEASE_NO_DEPLOY_PASS"
