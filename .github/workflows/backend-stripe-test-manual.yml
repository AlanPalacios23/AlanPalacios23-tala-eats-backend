name: TALA EATS | Stripe TEST provider smoke (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-test:
    name: Stripe TEST-only intent and refund (never LIVE)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: stripe-test
    env:
      TALAEATS_STRIPE_TEST_SECRET_KEY: ${{ secrets.TALAEATS_STRIPE_TEST_SECRET_KEY }}
      STRIPE_LIVE_MODE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate TEST-only credentials (no secret prints)
        shell: bash
        run: |
          set -euo pipefail
          case "$TALAEATS_STRIPE_TEST_SECRET_KEY" in
            sk_test_*) echo "STRIPE_TEST_ONLY_GUARD_PASS" ;;
            *) echo "Refusing non-test Stripe credentials or missing secret"; exit 1 ;;
          esac
      - name: Install pinned Stripe SDK
        run: python -m pip install --disable-pip-version-check stripe==15.6.0
      - name: Test payment and idempotent refund in Stripe sandbox
        run: python scripts/stripe_test_provider_smoke.py
